name: Turintech
description: >-
  TurinTech AI builds Artemis, a code and AI optimization platform that searches
  configuration spaces across models, runtime, hardware, and source code to make
  production AI systems and software faster, cheaper, and more reliable without
  changing the existing stack. Artemis spans AI inference, agentic software,
  latency-critical infrastructure, and planning & scheduling, and is driven
  through the Artemis CLI, which imports Git repositories, generates and validates
  AI-optimized code versions (via LLM, agent, or genetic-algorithm methods), runs
  compile/test/benchmark validation, and opens optimization pull requests. TurinTech
  also offers evoML for automated machine-learning model building. Access is via the
  Artemis CLI and platform using an API key (ARTEMIS_API_KEY). The company is backed
  by Speedinvest.
